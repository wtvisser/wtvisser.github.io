# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# Site settings
lcoale                    : "en-US"
title                     : &name "Wicher Visser" # &name is a YAML anchor which can be *referenced later
email                     : wtvisser@gmail.com
description               : >- # this means to ignore newlines until "baseurl:"
  Personal home page and blog.
baseurl                   : "" # the subpath of your site, e.g. /blog
url                       : "" # the base hostname & protocol for your site, e.g. http://example.com
enable_copy_code_button   : true

# Search function on the top bar
search                    : true # default: false
search_full_content       : false # default: false

# Optional features
show_related_posts        : false
show_post_footers         : false

# Build settings
# theme: minima
# theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes@4.27.1

# Social icons
github_username: wtvisser
linkedin_username: wicher-visser

# Blog pagination
paginate: 5 # amount of posts to show
paginate_path: /blog/page:num/

# Analytics
# analytics:
#   provider               : "google-universal" # false (default), "google", "google-universal", "google-gtag", "custom"
#   google:
#     tracking_id          : "UA-2011187-3" # Replace this with your ID, or delete
#     anonymize_ip         : true

# Site Author
author:
  name             : *name # *name is a YAML reference pointing to the &anchor earlier
  avatar           : "/assets/images/wicher_visser_tieandsuit.png"
  bio              : "I build flexible software systems that allow businesses to pivot and grow, and help fellow engineers to grow and accomplish these goals for themselves. I have experience across many industries: life science, finance, industry and the public sector."
  location         : "Zurich, Switzerland"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wtvisser"      
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/wicher-visser/"
    - label: "Feed"
      icon: "fa fa-fw fa-rss-square"
      url: "/feed.xml"

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wtvisser"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/wicher-visser/"

# Sidebar
#   # nav: "docs"
#   - title: "Custom sidebar"
#     image: http://placehold.it/350x250
#     image_alt: "image"
#     text: "Some text here."
#   - title: "Another Title"
#     text: "More text here."        

# Include for processing.
include:
  - _pages

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true # enabling author profile on the left sidebar: https://mmistakes.github.io/minimal-mistakes/docs/layouts/#author-profile
      read_time: true
      comments: true
      share: true
      related: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-sitemap
  - jemoji
exclude: [vendor]